[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forbuilder"
version = "0.1.0"
description = "Create FORBILD digital phantom volumes as 3-D uint8 arrays"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "tifffile",
    "nibabel",
    "zarr>=3.0",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forbuilder"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/forbuilder"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
